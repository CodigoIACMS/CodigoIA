name = "codigoia-admin-api"
main = "src/index.js"
compatibility_date = "2026-09-23"

[vars]
GITHUB_APP_ID = "COLOQUE_O_APP_ID"
GITHUB_INSTALLATION_ID = "COLOQUE_A_INSTALLATION_ID"
GITHUB_OWNER = "SEU_USUARIO_OU_ORG"
GITHUB_REPO = "SEU_REPOSITORIO"
GITHUB_BRANCH = "main"
PUBLIC_SITE_URL = "https://SEU_DOMINIO_OU_GITHUB_PAGES"
ADMIN_GITHUB_LOGIN = "SEU_LOGIN_GITHUB"

[secrets]
required = [
  "GITHUB_CLIENT_ID",
  "GITHUB_CLIENT_SECRET",
  "GITHUB_APP_PRIVATE_KEY",
  "SESSION_SECRET"
]
